<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>StickMan vs Boss</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      z-index: 10;
      padding: 12px;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    #ui-overlay .title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }
    #ui-overlay .hint {
      font-size: 13px;
      text-align: center;
      opacity: 0.7;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <div class="title">StickMan vs Boss</div>
    <div class="hint" id="hint">Нажмите и ведите палец — стикмен следует за вами</div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
